<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>💌 누군가의 스마트폰</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 폰 프레임: 모바일에선 전체 화면, 데스크톱에선 가운데 390x844 -->
  <div id="phone">
    <!-- 상태바 (홈/앱에서 표시) -->
    <div id="statusbar" class="statusbar">
      <span class="sb-time"></span>
      <span class="sb-icons">
        <svg viewBox="0 0 20 14" width="18"><path d="M10 13l3-3.5a4.5 4.5 0 00-6 0zM4.5 7.3a8 8 0 0111 0l1.6-1.8a10.5 10.5 0 00-14.2 0zM1.3 3.8a13 13 0 0117.4 0L20 2.3a15 15 0 00-20 0z" fill="currentColor"/></svg>
        <svg viewBox="0 0 28 13" width="26"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><rect x="25" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <!-- 1. 잠금화면 -->
    <section id="lock" class="screen active">
      <div class="lock-clock"></div>
      <div class="lock-date"></div>
      <div class="lock-noti">
        <div class="icon-mini" data-icon="dday"></div>
        <div class="noti-body"><b class="noti-app"></b><span class="noti-text"></span></div>
        <span class="noti-time"></span>
      </div>
      <div class="lock-hint">위로 밀거나 탭하여 잠금 해제</div>
    </section>

    <!-- 비밀번호 입력 -->
    <section id="passcode" class="screen">
      <div class="pc-title">암호 입력</div>
      <div class="pc-dots"><i></i><i></i><i></i><i></i></div>
      <div class="pc-pad"></div>
      <button class="pc-cancel">취소</button>
    </section>

    <!-- 2. 홈 화면 -->
    <section id="home" class="screen">
      <div class="widgets">
        <div class="widget w-cal"></div>
        <div class="widget w-weather"></div>
      </div>
      <div class="app-grid"></div>
    </section>

    <!-- 앱 컨테이너 -->
    <section id="app" class="app-window"></section>

    <!-- 카톡 배너 -->
    <div id="banner" class="banner">
      <div class="icon-mini" data-icon="kakao"></div>
      <div class="noti-body"><b></b><span></span></div>
      <span class="noti-time">지금</span>
    </div>

    <!-- 이미지 확대 -->
    <div id="viewer" class="viewer"><img alt="" /></div>

    <!-- 홈 인디케이터 -->
    <button id="homebar" class="homebar" aria-label="홈"></button>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
